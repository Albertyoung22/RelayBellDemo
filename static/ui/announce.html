<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📢 班級公告看板</title>
  <style>
    html,
    body {
      margin: 0;
      background: #0f1624;
      color: #e9f2ff;
      font-family: system-ui, -apple-system, "Microsoft JhengHei", Segoe UI, Roboto, Arial
    }

    .wrap {
      display: flex;
      flex-direction: column;
      min-height: 100vh
    }

    header {
      padding: 10px 14px;
      background: #1e7bd8;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px
    }

    .card {
      max-width: 1100px;
      width: 100%;
      background: #0b1421;
      border: 1px solid #1c2a3e;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
      padding: 28px
    }

    #msg {
      font-size: 46px;
      line-height: 1.3;
      margin: 12px 0 16px 0;
      white-space: pre-wrap
    }

    #msg.fade-out {
      animation: msgFade .9s forwards
    }

    @keyframes msgFade {
      to {
        opacity: 0;
        visibility: hidden
      }
    }

    #msg.video-mode {
      font-size: 28px;
      color: #c8d6e5
    }

    #img {
      max-width: 100%;
      max-height: 60vh;
      display: none;
      border-radius: 12px;
      border: 1px solid #203049
    }

    #videoWrap {
      display: none;
      margin-top: 12px
    }

    #videoWrap iframe {
      width: 100%;
      height: 62vh;
      border: none;
      border-radius: 12px;
      background: #000
    }

    #videoHint {
      display: none;
      margin-top: 6px;
      font-size: 13px;
      color: #9fb6d1
    }

    .media-prompt {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid #24406a;
      border-radius: 10px;
      background: #132036;
      color: #e9f2ff;
      font-size: 14px
    }

    .media-prompt button {
      margin-top: 6px;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
      transition: all .15s ease;
      background: #1e7bd8;
      color: #fff
    }

    .media-prompt button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    .media-prompt button:active {
      filter: brightness(.95);
      transform: translateY(0)
    }

    footer {
      padding: 10px 14px;
      color: #9fb6d1;
      font-size: 13px
    }

    #btnReinstall {
      margin-left: 10px;
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid #2c3d57;
      border-radius: 8px;
      background: #1e7bd8;
      color: #fff;
      cursor: pointer;
      transition: all .15s ease
    }

    #btnReinstall:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    #btnReinstall:active {
      filter: brightness(.95);
      transform: translateY(0)
    }

    /* 同意彈窗 */
    .consent-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999
    }

    .consent-box {
      background: #0b1421;
      border: 1px solid #1c2a3e;
      border-radius: 14px;
      padding: 20px;
      max-width: 520px;
      width: 92%;
      color: #e9f2ff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35)
    }

    .consent-box h3 {
      margin: 0 0 10px 0;
      font-size: 20px
    }

    .consent-box p {
      margin: 6px 0;
      line-height: 1.5;
      font-size: 15px;
      color: #c8d6e5
    }

    .consent-actions {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
      transition: all .15s ease;
      background: #1e7bd8;
      color: #fff
    }

    .btn.secondary {
      background: #223043;
      color: #c8d6e5
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px)
    }

    .btn:active {
      filter: brightness(.95);
      transform: translateY(0)
    }

    .consent-hint {
      font-size: 13px;
      color: #8aa0bb;
      margin-top: 6px
    }
  </style>
</head>

<body>

  <div class="wrap">
    <header>
      <div>📢 班級公告看板</div>
      <div style="font-size:14px; display:flex; gap:12px;">
        <a href="index.html" style="color:#dff1ff; text-decoration:none;">🎛 主控台</a>

        <a href="broadcast.html" style="color:#dff1ff; text-decoration:none;">🎙️ 廣播</a>
        <a href="sched.html" style="color:#dff1ff; text-decoration:none;">🕐 排程</a>
        <button id="btnFS"
          style="background:rgba(255,255,255,0.2); border:none; color:white; padding:4px 8px; border-radius:4px; cursor:pointer;">全螢幕</button>
      </div>
    </header>
    <main>
      <div class="card">
        <div id="msg">（等待公告…）</div>
        <img id="img" alt="公告圖片" />
        <div id="videoWrap"><iframe id="ytFrame" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div id="videoHint">若影片無聲，請點擊播放鍵並解除靜音。</div>
        <div id="mediaPrompt" class="media-prompt">
          已收到音訊 / 影片，請點「播放」開始。
          <div><button id="btnPlayMedia" type="button">播放</button></div>
        </div>
        <audio id="audioPlayer" style="display:none;width:100%;margin-top:8px" controls></audio>
        <video id="videoPlayer" style="display:none;width:100%;max-height:62vh;margin-top:8px" controls></video>
      </div>
    </main>
    <footer>狀態：<span id="stat">連線中…</span> <button id="btnReinstall" type="button">重新下載安裝器</button></footer>
  </div>

  <script>
    /* ------------------------
       ✅ 防重複播放：狀態記錄
    ------------------------ */
    let lastMsg = "";
    let lastTs = 0;
    let lastEmbed = "";
    let lastMediaUrl = "";
    let lastMediaType = "";
    let lastImageUrl = "";
    let lastSound = 1;

    const API = (new URLSearchParams(location.search)).get("api") || location.origin;
    const INSTALLER_URL = "/static/setup/student_agent.exe"; // 下載安裝器路徑

    function toYoutubeEmbed(url, ts) {
      if (!url) return "";
      try {
        let videoId = "";
        const u = new URL(url);

        // Handle youtu.be/ID
        if (u.hostname.includes("youtu.be")) {
          videoId = u.pathname.slice(1);
        }
        // Handle youtube.com/watch?v=ID
        else if (u.pathname === "/watch") {
          videoId = u.searchParams.get("v");
        }
        // Handle youtube.com/embed/ID
        else if (u.pathname.startsWith("/embed/")) {
          videoId = u.pathname.split("/")[2];
        }
        // Handle youtube.com/shorts/ID
        else if (u.pathname.startsWith("/shorts/")) {
          videoId = u.pathname.split("/")[2];
        }
        // Handle youtube.com/live/ID
        else if (u.pathname.startsWith("/live/")) {
          videoId = u.pathname.split("/")[2];
        }

        // Clean up ID (remove extra params if dragged in path)
        if (videoId) {
          videoId = videoId.split('&')[0].split('?')[0];
        }

        if (videoId) {
          const suffix = `?autoplay=1&mute=1&playsinline=1&rel=0&controls=1&modestbranding=1&t=${ts || ""}`;
          return `https://www.youtube.com/embed/${videoId}${suffix}`;
        }
        return "";
      } catch (e) {
        // Fallback simple regex
        const m = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
        if (m && m[1]) {
          const suffix = `?autoplay=1&mute=1&playsinline=1&rel=0&controls=1&modestbranding=1&t=${ts || ""}`;
          return `https://www.youtube.com/embed/${m[1]}${suffix}`;
        }
        return "";
      }
    }

    /* ------------------------
       ✅ 新增：WebSocket 音訊接收器
    ------------------------ */
    let audioQueue = [];
    let isPlayingAudio = false;
    let lastAudioUrl = "";
    let lastAudioTs = 0;
    const player = new Audio();

    function processAudioQueue() {
      if (isPlayingAudio || audioQueue.length === 0) return;
      isPlayingAudio = true;
      let url = audioQueue.shift();
      if (url.startsWith('/') && API) {
        // Handle absolute-path URLs if API is defined
        const base = API.endsWith('/') ? API.slice(0, -1) : API;
        url = base + url;
      }
      console.log("[AudioWS] Processing:", url);

      player.onended = () => {
        isPlayingAudio = false;
        setTimeout(processAudioQueue, 300);
      };
      player.onerror = (e) => {
        console.error("[AudioWS] Playback failed:", url, e);
        isPlayingAudio = false;
        setTimeout(processAudioQueue, 500);
      };

      player.src = url;
      player.play().catch(err => {
        console.warn("[AudioWS] Autoplay blocked, queuing for manual trigger or next interaction.");
        isPlayingAudio = false;
        audioQueue.unshift(url);
        // Show media prompt if blocked
        const prompt = document.getElementById("mediaPrompt");
        if (prompt) prompt.style.display = "block";
      });
    }

    function connectAudioWS() {
      const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/web";
      console.log("[AudioWS] Connecting to:", wsUrl);
      const ws = new WebSocket(wsUrl);
      let heartbeat;

      ws.onopen = () => {
        console.log("[AudioWS] Connected");
        heartbeat = setInterval(() => { if (ws.readyState === 1) ws.send("PING"); }, 15000);
      };
      const audioSessionId = Math.random().toString(36).substring(7);
      console.log(`[AudioReceiver] Started Session: ${audioSessionId}`);

      ws.onmessage = (e) => {
        if (e.data === "PONG") return;
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'play_audio') {
            const msgGuid = data.guid || (data.ts + "_" + (data.url || "").split('?')[0]);
            const key = "played_" + msgGuid;

            if (localStorage.getItem(key)) {
              console.log(`[AudioWS][${audioSessionId}] Dedupe skip:`, msgGuid);
              return;
            }
            localStorage.setItem(key, "1");

            const now = Date.now();
            if (data.url === lastAudioUrl && (now - lastAudioTs) < 1000) return;
            lastAudioUrl = data.url; lastAudioTs = now;

            console.log(`[AudioWS][${audioSessionId}] Queuing:`, data.url);
            audioQueue.push(data.url);
            processAudioQueue();
          } else if (data.type === 'stop_audio') {
            console.log(`[AudioWS][${audioSessionId}] Stop signal`);
            audioQueue = []; isPlayingAudio = false;
            player.pause(); player.currentTime = 0;
          }
        } catch (err) { }
      };
      ws.onclose = () => {
        clearInterval(heartbeat);
        setTimeout(connectAudioWS, 5000);
      };
    }

    function speakIfNeeded(txt, on) {
      if (!on) return;
      console.log("[Speak] Announcement (Server Audio anticipated):", txt);
      return;
    }

    function applyState(st) {
      const msg = st.message || "";
      const ts = st.ts || 0;
      const media = st.media || st.media_url || "";
      const mediaType = (st.media_type || "").toLowerCase();
      const imageUrl = st.image || st.image_url || "";
      const rawVideo = st.video || st.yt || st.youtube || st.video_url || st.youtube_url || "";
      let ytUrl = rawVideo;
      if (!ytUrl) {
        const match = msg.match(/https?:\/\/[^\s]+/);
        if (match && (match[0].includes("youtube.com") || match[0].includes("youtu.be"))) {
          ytUrl = match[0];
        }
      }
      const tsForEmbed = ts ? Math.floor(Number(ts) / 1000) : 0;
      const embed = toYoutubeEmbed(ytUrl, tsForEmbed);
      const hasPayload = !!(msg || imageUrl || media || embed);
      if (!hasPayload) {
        // &#128229;&#128229;&#128229;&#128229;&#128229;&#128229;&#128229;&#128229;?
        return;
      }
      const soundFlag = (st.sound === 1 || st.sound === "1" || st.sound === true || st.sound === "true") ? 1 : 0;
      // 去重：文字/圖片/影音/聲音旗標/時間都相同才略過，確保有聲/無聲切換會更新
      if (msg === lastMsg && imageUrl === lastImageUrl && embed === lastEmbed && media === lastMediaUrl && soundFlag === lastSound && ts === lastTs) {
        return;
      }
      let cleanedMsg = msg;
      if (embed) {
        // 去掉主網址與其餘殘留的 http(s) 片段，避免大網址佔版面
        cleanedMsg = cleanedMsg.replace(ytUrl || "", "");
        cleanedMsg = cleanedMsg.replace(/https?:\/\/\S+/g, "");
        cleanedMsg = cleanedMsg.trim();
        if (!cleanedMsg) cleanedMsg = "影片播放中";
      }
      // 判斷是否為直接的 mp3/mp4 連結
      const isAudio = media && /\.(mp3|m4a|aac|wav|flac|ogg)$/i.test(media);
      const isVideo = media && /\.(mp4|mkv|mov|webm|m4v)$/i.test(media);

      const speakOn = soundFlag === 1;

      /* ✅ 防止重複播放（文字相同 + ts 相同 → 不播） */
      if (msg === lastMsg && ts === lastTs) {
        console.log("🔁 相同公告，略過播放");
      } else {
        if (speakOn) {
          speakIfNeeded(msg, true);
        } else if ("speechSynthesis" in window) {
          try { speechSynthesis.cancel(); } catch (e) { }
        }
      }

      lastMsg = msg;
      lastTs = ts;

      // 更新畫面
      const m = document.getElementById("msg");
      const img = document.getElementById("img");
      const vwrap = document.getElementById("videoWrap");
      const vframe = document.getElementById("ytFrame");
      const vhint = document.getElementById("videoHint");
      const audioEl = document.getElementById("audioPlayer");
      const videoEl = document.getElementById("videoPlayer");
      const mediaPrompt = document.getElementById("mediaPrompt");
      const btnPlayMedia = document.getElementById("btnPlayMedia");
      const hasMediaOnly = (!cleanedMsg) && (st.image || media || embed);
      m.classList.remove("fade-out");
      m.style.visibility = "";
      m.style.opacity = "";
      delete m.dataset.mediaPrompt;
      if (cleanedMsg) {
        m.textContent = cleanedMsg;
        m.style.display = "";
        m.style.fontSize = "";
      } else if (hasMediaOnly) {
        m.textContent = "收到媒體，請點「播放」開始。";
        m.style.display = "";
        m.style.fontSize = "32px"; // Smaller prompt when only media is available
        m.dataset.mediaPrompt = "1";
      } else {
        m.textContent = "（無訊息）";
        m.style.display = "";
        m.style.fontSize = "";
      }

      if (st.image) {
        img.src = st.image + "?t=" + ts;
        img.style.display = "block";
      } else {
        img.removeAttribute("src");
        img.style.display = "none";
      }

      if (embed) {
        if (embed !== lastEmbed) {
          vframe.src = embed;
          lastEmbed = embed;
        }
        m.classList.add("video-mode");
        vwrap.style.display = "block";
        vhint.style.display = "block";
        audioEl.style.display = "none";
        videoEl.style.display = "none";
        mediaPrompt.style.display = "none";
        lastMediaUrl = "";
        lastMediaType = "";
      } else {
        if (lastEmbed) {
          vframe.removeAttribute("src");
          lastEmbed = "";
        }
        m.classList.remove("video-mode");
        vwrap.style.display = "none";
        vhint.style.display = "none";
        // 處理直接的 mp3/mp4
        if (isAudio) {
          if (media !== lastMediaUrl || mediaType !== lastMediaType) {
            audioEl.src = media;
            lastMediaUrl = media;
            lastMediaType = mediaType || "audio";
            // Auto-play immediately
            audioEl.play().catch(e => console.log("Audio autoplay blocked:", e));
          }
          audioEl.style.display = "block";
          videoEl.style.display = "none";
          mediaPrompt.style.display = "none";
        } else if (isVideo) {
          if (media !== lastMediaUrl || mediaType !== lastMediaType) {
            videoEl.src = media;
            lastMediaUrl = media;
            lastMediaType = mediaType || "video";
            // Auto-play immediately
            videoEl.play().catch(e => console.log("Video autoplay blocked:", e));
          }
          videoEl.style.display = "block";
          audioEl.style.display = "none";
          mediaPrompt.style.display = "none";
        } else {
          audioEl.removeAttribute("src");
          videoEl.removeAttribute("src");
          audioEl.style.display = "none";
          videoEl.style.display = "none";
          mediaPrompt.style.display = "none";
          lastMediaUrl = "";
          lastMediaType = "";
        }
      }
      // 記錄最新狀態避免重複重繪
      lastMsg = msg;
      lastTs = ts;
      lastImageUrl = imageUrl;
      lastSound = soundFlag;
    }

    async function pullOnce() {
      try {
        const r = await fetch(API + "/announce_data", { cache: "no-store" });
        const j = await r.json();
        applyState(j);
        document.getElementById("stat").textContent = "已同步";
      }
      catch (e) {
        document.getElementById("stat").textContent = "連線失敗";
      }
    }

    function connectSSE() {
      const s = new EventSource(API + "/announce_sse");

      s.addEventListener("announce", (ev) => {
        try {
          applyState(JSON.parse(ev.data));
          document.getElementById("stat").textContent = "已更新";
        } catch (e) { }
      });

      s.onerror = () => {
        document.getElementById("stat").textContent = "SSE 中斷，改用輪詢";
        s.close();
        setInterval(pullOnce, 3000);
      };
    }

    document.getElementById("btnFS").addEventListener("click", () => {
      const de = document.documentElement;
      if (de.requestFullscreen) de.requestFullscreen();
    });

    // 手動播放提示：避免瀏覽器阻擋自動播放
    document.getElementById("btnPlayMedia").addEventListener("click", () => {
      const audioEl = document.getElementById("audioPlayer");
      const videoEl = document.getElementById("videoPlayer");
      const mediaPrompt = document.getElementById("mediaPrompt");
      const msgEl = document.getElementById("msg");
      const tasks = [];
      if (videoEl.style.display !== "none" && videoEl.src) {
        tasks.push(videoEl.play());
      }
      if (audioEl.style.display !== "none" && audioEl.src) {
        tasks.push(audioEl.play());
      }
      Promise.allSettled(tasks).finally(() => {
        mediaPrompt.style.display = "none";
      });
      if (msgEl && msgEl.dataset.mediaPrompt === "1") {
        msgEl.classList.add("fade-out");
        setTimeout(() => {
          if (msgEl.classList.contains("fade-out")) {
            msgEl.style.display = "none";
          }
        }, 900);
      }
    });

    /* ------------------------
       使用者同意 + 下載安裝器
    ------------------------ */
    function showConsentIfNeeded() {
      // 允許以 ?installed=1 標記已安裝；?reset=1 可重置旗標以便再顯示
      const params = new URLSearchParams(location.search);
      if (params.get("reset") === "1") {
        localStorage.removeItem("lan_broadcast_installed");
        localStorage.removeItem("lan_broadcast_consent");
      }
      if (params.get("installed") === "1") {
        localStorage.setItem("lan_broadcast_installed", "yes");
        return;
      }
      if (localStorage.getItem("lan_broadcast_installed") === "yes") return;

      const backdrop = document.createElement("div");
      backdrop.className = "consent-backdrop";
      backdrop.innerHTML = `
    <div class="consent-box">
      <h3>同意安裝校內廣播接收程式</h3>
      <p>此程式會在背景自動尋找校內廣播伺服器，並在有公告時顯示 / 播報。安裝後將於開機時自動啟動。</p>
      <p>請確認您同意以上行為，並於下載後自行執行安裝程式。</p>
      <div class="consent-actions">
        <button id="btnAgree" class="btn">同意並下載</button>
        <button id="btnInstalled" class="btn secondary">我已完成安裝</button>
        <button id="btnLater" class="btn secondary">稍後再說</button>
      </div>
      <div class="consent-hint">下載完成後請手動執行安裝程式以啟用自動廣播接收。</div>
    </div>`;

      document.body.appendChild(backdrop);
      document.getElementById("btnAgree").onclick = () => {
        // 點擊下載時視為已同意（不標記已安裝，方便移除後能再觸發）
        localStorage.setItem("lan_broadcast_consent", "yes");
        window.location.href = INSTALLER_URL;
        backdrop.remove();
      };
      document.getElementById("btnInstalled").onclick = () => {
        // 學生確認已安裝完，可手動關閉提示
        localStorage.setItem("lan_broadcast_installed", "yes");
        localStorage.setItem("lan_broadcast_consent", "yes");
        backdrop.remove();
      };
      document.getElementById("btnLater").onclick = () => backdrop.remove();
    }

    window.addEventListener("load", () => {
      pullOnce();
      // 立即啟動輪詢，確保就算 SSE 不可用也能持續更新
      setInterval(pullOnce, 3000);
      // 嘗試 SSE，若失敗會自動 fallback 上面的輪詢
      connectSSE();
      connectAudioWS();
      showConsentIfNeeded();
    });

    // 提供重置下載提示的輔助函式（可在控制台呼叫 resetConsentPrompt()）
    function resetConsentPrompt() {
      localStorage.removeItem("lan_broadcast_installed");
      localStorage.removeItem("lan_broadcast_consent");
      showConsentIfNeeded();
    }

    // 頁尾「重新下載安裝器」按鈕：重置旗標並彈出同意下載
    const btnRe = document.getElementById("btnReinstall");
    if (btnRe) {
      btnRe.addEventListener("click", () => {
        resetConsentPrompt();
      });
    }

  </script>

  <!-- ★ 新增：自動播放解鎖遮罩 (仿照 student.html / watch.html) -->
  <style>
    #unlock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 22, 36, 0.9);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }

    .unlock-box {
      text-align: center;
      background: #1c2a3e;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #2c3d57;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .unlock-btn {
      background: #1e7bd8;
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(30, 123, 216, 0.4);
    }

    .unlock-btn:hover {
      background: #1976D2;
      transform: scale(1.05);
    }
  </style>

  <div id="unlock-overlay">
    <div class="unlock-box">
      <h2 style="margin-top:0; color:#fff;">📢 班級公告看板</h2>
      <p style="color:#9fb6d1; margin-bottom:24px;">點擊下方按鈕以啟用自動播報功能</p>
      <button id="btnUnlock" class="unlock-btn">啟用看板</button>
    </div>
  </div>

  <script>
    (function () {
      const overlay = document.getElementById("unlock-overlay");
      const btn = document.getElementById("btnUnlock");

      function unlock() {
        // 解鎖 SpeechSynthesis
        if ("speechSynthesis" in window) {
          speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(" ");
          u.volume = 0;
          speechSynthesis.speak(u);
        }
        // 解鎖 AudioContext (若有)
        const audio = document.getElementById("audioPlayer");
        if (audio) {
          audio.play().catch(() => { });
          audio.pause();
        }

        overlay.style.display = "none";
      }

      btn.addEventListener("click", unlock);

      // 檢查 URL autoplay 參數
      const params = new URLSearchParams(location.search);
      if (params.get("autoplay") === "1") {
        // 若有 autoplay，顯示遮罩讓 Agent 點擊 (或使用者點擊)
        // [User Request] Disable popup warning (overlay)
        // overlay.style.display = "flex";
        console.log("Autoplay requested, but overlay disabled by user request.");

        // Try to auto-unlock without user interaction if possible (best effort)
        setTimeout(unlock, 500);
      }
    })();
  </script>

</body>

</html>
